version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: quantumshield-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: quantumshield
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantumshield-backend
    restart: unless-stopped
    ports:
      - "80:5001"
      - "5001:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/quantumshield
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
