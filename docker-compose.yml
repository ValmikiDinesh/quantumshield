version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: quantumshield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quantumshield
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantumshield-backend
    restart: unless-stopped
    ports:
      - "80:5001"
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/quantumshield
      - JWT_SECRET=quantumshield_production_compose_secret_12345
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=http://localhost:5173
      - MAX_UPLOAD_SIZE_MB=25
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
